<text x="600.0" y="618" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">假设种子 + 格式模板</text>
<text x="600.0" y="638" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">SHA 去重，写 corpus/</text>
<text x="600.0" y="658" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">同时生成源码/比较常量字典</text>
