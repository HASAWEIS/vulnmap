<text x="720.0" y="956" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#17202a">D3 分诊门禁</text>
<text x="720.0" y="978" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">有效诊断（非 unknown/allocator）+ 干净重建 3/3</text>
<text x="720.0" y="998" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">WRITE→confirmed · READ/UB→weakened · 0/3→excluded · 不稳定→needs_human</text>
<line x1="720" y1="1030" x2="720" y2="1062" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="390" y="1062" width="660" height="74" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
<text x="720.0" y="1088" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#17202a">D3.5 复核</text>
<text x="720.0" y="1110" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">规则复核，或显式开启单次 LLM 复核；不得超过门禁上限</text>
<line x1="720" y1="1136" x2="720" y2="1168" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360" y="1168" width="720" height="84" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
<text x="720.0" y="1194" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#17202a">D4 报告 + 台账</text>
<text x="720.0" y="1216" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">分析完整性 · 风险统计 · 发现条目 → report.json / report.md</text>
<text x="720.0" y="1236" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">SQLite campaign.db：campaign/binary/call_site/candidate/review/finding/coverage</text>
