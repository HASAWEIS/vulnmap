<text x="720.0" y="1426" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#17202a">展示层（只读）</text>
<text x="720.0" y="1448" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">只读 API / UI：/api/discovery/campaigns … 五个 Discovery 页面</text>
<rect x="90" y="1510" width="1260" height="150" rx="12" fill="#f3f4f6" stroke="#9aa7b4" stroke-width="1.4"/>
<text x="114" y="1540" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#17202a">边界与当前结论</text>
<text x="120" y="1568" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#17202a">• 每个输入起一个进程，约 500–1000 exec/s；没有 persistent mode / fork server。</text>
<text x="120" y="1590" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#17202a">• 覆盖率以函数级为主；bitmap 64K、字典 96 条、比较操作 512 条有上限。</text>
<text x="120" y="1612" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#17202a">• 真实目标 cJSON 只到 weakened READ；libpng/libtiff 结构化 Fuzz 仍 0 崩溃。</text>
<text x="120" y="1634" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#17202a">• 受控 PNG/TIFF fixture 有 confirmed WRITE；不能当作真实目标战果。</text>
<text x="120" y="1656" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#17202a">• 负结果与 0 覆盖一律保留；崩溃数不等于高危数。</text>
</svg>