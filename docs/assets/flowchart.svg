<text x="720.0" y="222" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#17202a">D0 静态档案</text>
<text x="720.0" y="244" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">suffix .c/.cc/.cpp/.h/.hpp · ELF magic · main( · 函数 · 格式 → target.json</text>
<line x1="720.0" y1="266" x2="720.0" y2="296" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="370" y="296" width="700" height="78" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
<text x="720.0" y="322" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#17202a">D1 危险调用点排序</text>
<text x="720.0" y="344" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">memcpy/strcpy/sprintf/malloc/read… 权重 3/2/1 + 近似可达 + 参数可控 → score</text>
<text x="720.0" y="364" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">planned / covered / uncovered 台账 → callsites.json</text>
<line x1="720.0" y1="374" x2="720.0" y2="404" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
