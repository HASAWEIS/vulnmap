<text x="720.0" y="1332" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">ranked vs random；Agent 种子 vs 纯 fuzz</text>
<text x="720.0" y="1352" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">指标：覆盖率 / confirmed / time-to-first-crash；负结果保留</text>
