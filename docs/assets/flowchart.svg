<text x="1200.0" y="614" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">bwrap（默认）/ unshare</text>
<text x="1200.0" y="634" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">网络 none · 只读根 · cap-drop</text>
<text x="1200.0" y="654" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">超时 2s，kill 进程组</text>
