<text x="720.0" y="430" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#17202a">D1.5 并行分析 Worker</text>
<text x="720.0" y="452" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">只读源码、不执行目标、不产 verdict；默认 LLM，无 key/异常回退 heuristic</text>
<text x="720.0" y="472" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">30 行窗口 + citations 校验 → hypothesis.json；假设文本 → 定向种子 + 字典</text>
<line x1="720.0" y1="492" x2="720.0" y2="524" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
