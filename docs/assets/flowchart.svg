<text x="90" y="730" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#5b6b7c">覆盖反馈：只保留“走到新代码”的输入；</text>
<text x="90" y="752" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#5b6b7c">崩溃是搜索副产品，不是高危结论。</text>
<text x="90" y="790" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#5b6b7c">覆盖率归属：COV_PCS → addr2line -f -C</text>
<text x="90" y="812" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#5b6b7c">→ file:line / function → 回写 callsites.json</text>
