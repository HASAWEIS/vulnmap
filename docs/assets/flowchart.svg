<text x="255.0" y="678" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">cov_rt.c 单独编译；内置/自定义 harness</text>
