<text x="720.0" y="74" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#5b6b7c">输入只有源码/二进制 + 构建方式；Agent 只指路，Fuzz 证明，Triage/Review 判定。</text>
<rect x="420" y="100" width="600" height="64" rx="10" fill="#eaf2ff" stroke="#4a5568" stroke-width="1.6"/>
<text x="720.0" y="122.0" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">源码 / 二进制 + target.yaml（构建方式）</text>
<text x="720.0" y="142.0" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#17202a">不读 error.txt / patch.diff / 官方 PoC</text>
<line x1="720.0" y1="164" x2="720.0" y2="196" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
