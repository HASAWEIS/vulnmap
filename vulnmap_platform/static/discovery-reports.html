<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports · vulnmap</title><link rel="stylesheet" href="style.css?v=202611161150"><style>
.report-selector{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.report-option{padding:12px 18px;border:1px solid var(--line);border-radius:8px;background:white;color:#61738b;font-size:13px}.report-option[aria-current=page]{background:#eaf0ff;border-color:#9eb6e4;color:#24477d}.report-option small{margin-left:12px;color:#8291a6}.report-top{display:flex;justify-content:space-between;align-items:start;gap:18px;margin:22px 0}.report-top h1{font-size:25px;color:#243f61;margin:5px 0 10px}.eyebrow{font:10px var(--mono);letter-spacing:2px;color:#8194af}.report-meta{font-size:11px;color:#7d8fa7;line-height:1.8}.exports{display:flex;gap:8px;flex-shrink:0}.exports button{padding:10px 15px;border:1px solid #cbd7e9;background:white;border-radius:7px;color:#34577f;cursor:pointer}.exports button:first-child{background:#2f568a;color:white;border-color:#2f568a}.exports button:disabled{opacity:.5;cursor:wait}.report-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:start}.report-outline{position:sticky;top:18px;background:white;border:1px solid var(--line);border-radius:9px;max-height:calc(100vh - 40px);overflow:auto;padding:16px}.report-outline summary{font-size:13px;font-weight:600;color:#365477;cursor:pointer}.report-outline nav{margin-top:14px}.report-outline a{display:block;font-size:11px;line-height:1.7;padding:7px 8px;border-radius:5px;color:#7b8ca3;overflow-wrap:anywhere}.report-outline a:hover,.report-outline a.active{background:#edf2fb;color:#31598d}.report-outline a.sample-link{padding-left:18px;font-size:10px}.report-counts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}.report-counts>div{background:white;border:1px solid var(--line);border-radius:8px;padding:16px}.report-counts span{display:block;font-size:10px;color:#8697ad}.report-counts b{display:block;font:600 26px var(--mono);margin-top:8px;color:#36577e}.report-section{padding:26px;margin-bottom:18px;scroll-margin-top:20px;min-width:0}.report-section h2{color:#29486e;font-size:19px;line-height:1.7;margin:0 0 20px;overflow-wrap:anywhere}.report-section h3{font-size:13px;color:#43658e;margin:25px 0 12px}.report-section p{font-size:12px;line-height:1.95;color:#6d8099;overflow-wrap:anywhere;white-space:pre-wrap}.report-section .tw{border:1px solid var(--line);border-radius:7px;margin:12px 0;overflow:auto}.report-section table{table-layout:fixed;min-width:460px;width:100%;font-size:11px}.report-section th,.report-section td{white-space:normal;overflow-wrap:anywhere;padding:11px 13px;line-height:1.8;vertical-align:top}.report-section th:first-child,.report-section td:first-child{width:25%;color:#607a9d}.report-section pre{font:11px/1.8 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fb;border:1px solid #e4ebf5;padding:16px;border-radius:7px;color:#627c9a;max-height:420px;overflow:auto}.report-boundary{padding:14px 17px;border-left:3px solid #9fb5d8;background:#f0f4fa;font-size:11px;line-height:1.9;color:#7589a4;margin-bottom:22px}.sample-actions{display:flex;gap:12px;margin:-7px 0 18px;font-size:11px}.export-status{font-size:11px;color:#7d8fa7;min-height:20px;text-align:right}.report-section h3,.report-section h2{scroll-margin-top:24px}
@media(max-width:1100px){.report-layout{grid-template-columns:175px minmax(0,1fr);gap:12px}.report-section{padding:18px}.report-outline{padding:12px}.report-top{flex-wrap:wrap}}
@media(max-width:700px){.report-layout{display:block}.report-outline{position:static;max-height:310px;margin-bottom:16px}.report-counts{grid-template-columns:repeat(2,1fr)}.report-counts>div:last-child{grid-column:1/-1}.report-top h1{font-size:22px}.report-top{gap:10px}.exports{width:100%}.exports button{flex:1}.report-option{padding:10px 12px;flex:1}.report-option small{display:block;margin:5px 0 0}.report-section{padding:16px}.report-section h2{font-size:17px}.report-section table{min-width:440px}.report-meta{overflow-wrap:anywhere}.export-status{text-align:left}}

.report-section p{font-size:14px;line-height:1.95;color:#465b73;margin:12px 0 17px}.report-section h3{font-size:15px;color:#2c4769;margin-top:29px}.report-section h2{font-size:22px;color:#233f62;font-weight:650}.report-section p code,.finding-verdict code{font:12px var(--mono);background:#edf2f8;color:#365f8b;padding:2px 5px;border-radius:3px;overflow-wrap:anywhere}.finding-verdict{border-left:3px solid #91b3cf;background:#f0f5fb;padding:17px 19px;color:#345373;font-size:14px;line-height:1.95;margin-bottom:18px}.finding-verdict.warning{background:#fff9ee;border-color:#d4b779;color:#6d5a37}.finding-verdict.success{background:#edf6f3;border-color:#81b1a2;color:#355f52}.report-section table{font-size:12px}.report-section th,.report-section td{color:#556b83}.evidence-appendix{border:1px solid #dce5f0;border-radius:7px;margin-top:28px;background:#f9fbfe}.evidence-appendix>summary{padding:15px 17px;font-size:12px;font-weight:600;color:#657e9b;cursor:pointer}.appendix-body{padding:0 17px 17px}.appendix-body p{font-size:11px;color:#7c8fa6}.appendix-body h3{font-size:12px}.appendix-body table{font-size:11px}.sample-actions{flex-wrap:wrap;line-height:1.8;color:#7388a0}.report-outline a{font-size:12px;line-height:1.7}.report-outline a.sample-link{font-size:11px;padding-top:9px;padding-bottom:9px}.report-boundary{max-width:100%;font-size:12px}.report-section pre{max-height:270px;color:#3f5e7e}
@media(max-width:700px){.report-section h2{font-size:19px}.report-section h3{font-size:14px}.report-section p,.finding-verdict{font-size:13px}.finding-verdict{padding:13px}.appendix-body{padding:0 10px 10px}}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="tophead" id="tophead"></header><div class="content" id="content"><div class="loading">正在整理报告证据…</div></div></main></div><script src="app.js?v=202611161130"></script><script src="benchmark-report.js?v=202611161130"></script><script>
renderShell('discovery-reports',{title:'Reports',sub:'按 Benchmark 分组 · 每个 Benchmark 下按样例分节 · 数据来自验收台账'});
function inlineText(value){return esc(value).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');}
function blockHTML(b){
 if(b.kind==='appendix')return `<details class="evidence-appendix"><summary>${esc(b.title)}</summary><div class="appendix-body">${b.blocks.map(blockHTML).join('')}</div></details>`;
 if(b.kind==='callout')return `<div class="finding-verdict ${esc(b.tone)}">${inlineText(b.text)}</div>`;
 if(b.kind==='heading')return `<h3>${esc(b.text)}</h3>`;
 if(b.kind==='paragraph')return `<p>${inlineText(b.text)}</p>`;
 if(b.kind==='code')return `<pre><code>${esc(b.text)}</code></pre>`;
 if(b.kind==='table')return `<div class="tw" tabindex="0" role="region" aria-label="报告证据表"><table><thead><tr>${b.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 return '';
}
async function loadReport(){
 const [report,cs]=await Promise.all([api('/api/report'),api('/api/cases')]);renderProjects(cs.items);
 const groups=buildBenchmarkReports(report,cs.items);const requested=new URLSearchParams(location.search).get('benchmark');const key=requested||(groups[0]&&groups[0].key);
 const selected=groups.find(g=>g.key===key);
 const selector=`<nav class="report-selector" aria-label="选择 Benchmark 报告">${groups.map(g=>`<a class="report-option" href="discovery-reports.html?benchmark=${encodeURIComponent(g.key)}" ${g.key===key?'aria-current="page"':''}>${esc(BENCH_LABEL[g.key]||g.key)}<small>${g.counts.cases} 个样例 / 1 份报告</small></a>`).join('')}</nav>`;
 $('#content').innerHTML=selector+'<div class="loading">正在生成逐样例详细报告…</div>';
 if(!selected){$('#content').innerHTML=selector+'<div class="panel empty">未找到该 Benchmark，请选择已有分类。</div>';return;}
 const doc=await api('/api/benchmark-reports/'+encodeURIComponent(key));document.title=doc.title+' · vulnmap';
 const sampleMap=new Map(doc.samples.map(s=>[s.id,s]));
 $('#content').innerHTML=selector+`<div class="report-top"><div><span class="eyebrow">EVIDENCE-BASED RESEARCH REPORT</span><h1>${esc(doc.title)}</h1><div class="report-meta">${esc(doc.samples.length)} 个样例 · 生成于 ${esc(doc.generated_at)} · 数据来源：workspace case.json / LEDGER.json（验收台账）<br>证据快照 <span class="mono" title="${esc(doc.snapshot)}">${esc(doc.snapshot.slice(0,16))}…</span></div></div><div><div class="exports"><button type="button" data-export="pdf">↓ 导出 PDF</button><button type="button" data-export="md">↓ 导出 Markdown</button></div><div class="export-status" id="export-status" role="status" aria-live="polite"></div></div></div>
 <div class="report-boundary">${esc(doc.method)} 正文解释结论、触发链路、验证、影响与修复建议；原始字段和日志收在每个样例末尾的折叠附录中。</div>
 <div class="report-counts">${[['台账样例','cases'],['本地验证','local'],['因果链证据','causal'],['高危标记','high']].map(([name,k])=>`<div><span>${name}</span><b>${doc.counts[k]||0}</b></div>`).join('')}</div>
 <div class="report-layout"><details class="report-outline" ${matchMedia('(min-width:701px)').matches?'open':''}><summary>报告大纲 · ${doc.samples.length} 个样例</summary><nav aria-label="报告大纲">${doc.sections.map(s=>`<a href="#${esc(s.id)}" ${s.sample?'class="sample-link"':''}>${esc(s.title)}</a>`).join('')}</nav></details><article class="benchmark-report" data-benchmark="${esc(key)}" aria-label="${esc(doc.title)}">${doc.sections.map(s=>{const sample=sampleMap.get(s.id);return `<section class="panel report-section" id="${esc(s.id)}"><h2>${esc(s.title)}</h2>${sample?`<div class="sample-actions"><a href="cases.html#${encodeURIComponent(sample.dir)}">查看案例原始证据 ↗</a><span>${esc(sample.case_id)} · ${esc(sample.cwe||'分类待定')} · ${esc(sample.status_label||sample.verdict||'未记录')}</span></div>`:''}${s.blocks.map(blockHTML).join('')}</section>`;}).join('')}</article></div>`;
 $$('.exports button').forEach(btn=>btn.addEventListener('click',async()=>{
  const format=btn.dataset.export;btn.disabled=true;$('#export-status').textContent='正在生成 '+format.toUpperCase()+'…';
  try{const response=await fetch('/api/benchmark-reports/'+encodeURIComponent(key)+'/export?format='+format+'&snapshot='+encodeURIComponent(doc.snapshot));if(!response.ok){let msg;try{msg=(await response.json()).detail;}catch(_){}throw Error(msg||'导出失败，请重试');}const blob=await response.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vulnmap-'+key+'-report.'+format;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('#export-status').textContent='已生成 '+format.toUpperCase()+'，请查看下载。';}catch(e){$('#export-status').textContent=e.message;}finally{btn.disabled=false;}
 }));
 const observer=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting){$$('.report-outline a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+e.target.id));}}},{rootMargin:'0px 0px -65% 0px',threshold:0});$$('.report-section').forEach(s=>observer.observe(s));
}
loadReport().catch(e=>fail($('#content'),e));
</script></body></html>
